[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ginger"
version = "0.1.0"

[project.scripts]
ginger = "ginger.cli:main"

[project.optional-dependencies]
security = [
    "bandit[toml]==1.9.4",
    "pip-audit",
]

[tool.bandit]
exclude_dirs = [".venv", "tests", "build", "dist"]
